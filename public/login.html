<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in | Forest Energy FY27 Targets</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 522 481'%3E%3Crect width='522' height='481' fill='%23114d5d'/%3E%3Cg fill='%23fff' stroke='%23fff'%3E%3Crect x='36' y='242' width='451' height='71' stroke='none'/%3E%3Crect x='227' y='48' width='70' height='200' stroke='none'/%3E%3Crect x='227' y='360' width='70' height='71' stroke='none'/%3E%3Cpath d='M106 116L250 260M421 116L277 260' stroke-width='68' fill='none'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', Arial, sans-serif; font-size: 14px; color: #0d2830;
      background: #0d2830; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px;
    }
    .brand { display: flex; align-items: center; gap: 12px; color: #fff; margin-bottom: 28px; }
    .brand svg { width: 30px; height: 28px; }
    .brand span { font-family: 'Anek Bangla', Arial, sans-serif; font-weight: 700; font-size: 22px; line-height: 1; padding-top: 3px; }
    .card { background: #fff; border-radius: 10px; padding: 32px; width: 100%; max-width: 380px; }
    h1 { font-size: 20px; font-weight: 500; }
    .sub { color: #46717e; margin: 4px 0 24px; }
    label { display: block; font-size: 12px; font-weight: 500; color: #46717e; margin-bottom: 6px; }
    input {
      width: 100%; height: 42px; padding: 0 12px; margin-bottom: 16px;
      border: 1px solid #dde4e6; border-radius: 6px; font: inherit; color: inherit;
    }
    input:focus { outline: none; border-color: #114d5d; box-shadow: 0 0 0 3px rgba(17,77,93,0.12); }
    .error-msg { display: none; background: #fdf0ef; color: #b42318; border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px; }
    .error-msg.show { display: block; }
    button {
      width: 100%; height: 42px; margin-top: 4px; border: 0; border-radius: 6px;
      background: #114d5d; color: #fff; font: inherit; font-weight: 500; cursor: pointer;
    }
    button:hover { background: #0b3a47; }
    button:focus-visible { outline: 2px solid #26f0a3; outline-offset: 2px; }
    .footer { margin-top: 24px; font-size: 12px; color: rgba(255,255,255,0.55); }
  </style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 522 481" aria-hidden="true"><g fill="#fff" stroke="#fff"><rect x="36" y="242" width="451" height="71" stroke="none"/><rect x="227" y="48" width="70" height="200" stroke="none"/><rect x="227" y="360" width="70" height="71" stroke="none"/><path d="M106 116L250 260M421 116L277 260" stroke-width="68" fill="none"/></g></svg>
    <span>Forest Energy</span>
  </div>

  <div class="card">
    <h1>Sign in</h1>
    <p class="sub">FY27 company targets</p>

    <div id="errorMsg" class="error-msg" role="alert">Incorrect username or password.</div>

    <form method="POST" action="/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />

      <button type="submit">Sign in</button>
    </form>
  </div>

  <div class="footer">Internal use only</div>

  <script>
    if (window.location.search.includes('error=1')) {
      document.getElementById('errorMsg').classList.add('show');
    }
  </script>
</body>
</html>
